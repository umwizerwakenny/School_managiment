<body>

```
<!-- HEADER -->

<header>

    <h1>School Management System</h1>

    <nav>
        <a href="/">Home</a>
        <a href="/about">About Us</a>
        <a href="/students">Students</a>
        <a href="/teachers">Teachers</a>
        <a href="/subjects">Subjects</a>
        <a href="/classes">Classes</a>
        <a href="/contact">Contact</a>
    </nav>

</header>


<main>

    <h2>Students Management</h2>


    <!-- ADD / UPDATE STUDENT FORM -->

    <section class="form-section">

        <h3 id="formTitle">
            Add New Student
        </h3>


        <form id="studentForm">


            <!-- Hidden input stores student ID -->

            <input
                type="hidden"
                id="studentId"
            >


            <label for="name">
                Student Name:
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter student name"
                required
            >


            <label for="level">
                Level:
            </label>

            <input
                type="text"
                id="level"
                name="level"
                placeholder="Example: L3"
                required
            >


            <label for="trade">
                Trade:
            </label>

            <input
                type="text"
                id="trade"
                name="trade"
                placeholder="Example: Software Development"
                required
            >


            <div class="button-group">

                <button
                    type="submit"
                    id="submitBtn"
                >
                    Add Student
                </button>


                <button
                    type="button"
                    id="cancelBtn"
                    class="cancel-btn"
                    onclick="cancelEdit()"
                >
                    Cancel
                </button>

            </div>


        </form>

    </section>


    <!-- STUDENTS TABLE -->

    <section class="students-section">

        <h3>Students List</h3>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Level</th>
                    <th>Trade</th>
                    <th>Actions</th>
                </tr>

            </thead>


            <tbody id="studentsTable">

                <!-- Students appear here -->

            </tbody>

        </table>

    </section>

</main>


<footer>

    <p>
        &copy; 2026 School Management System
    </p>

</footer>



<script>


    // =====================================
    // GET HTML ELEMENTS
    // =====================================

    const studentForm =
        document.getElementById('studentForm');

    const studentId =
        document.getElementById('studentId');

    const nameInput =
        document.getElementById('name');

    const levelInput =
        document.getElementById('level');

    const tradeInput =
        document.getElementById('trade');

    const submitBtn =
        document.getElementById('submitBtn');

    const cancelBtn =
        document.getElementById('cancelBtn');

    const formTitle =
        document.getElementById('formTitle');

    const studentsTable =
        document.getElementById('studentsTable');


    // =====================================
    // LOAD STUDENTS
    // =====================================

    function loadStudents() {

        fetch('/api/students')

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        'Failed to load students'
                    );

                }

                return response.json();

            })

            .then(students => {

                // Clear table

                studentsTable.innerHTML = '';


                // No students

                if (students.length === 0) {

                    studentsTable.innerHTML = `

                        <tr>

                            <td
                                colspan="5"
                                style="text-align:center;"
                            >
                                No students found
                            </td>

                        </tr>

                    `;

                    return;

                }


                // Add students to table

                students.forEach(student => {

                    const row =
                        document.createElement('tr');


                    row.innerHTML = `

                        <td>
                            ${student.id}
                        </td>

                        <td>
                            ${student.name}
                        </td>

                        <td>
                            ${student.level}
                        </td>

                        <td>
                            ${student.trade}
                        </td>

                        <td>

                            <button
                                class="edit-btn"
                                onclick="editStudent(
                                    ${student.id},
                                    '${student.name}',
                                    '${student.level}',
                                    '${student.trade}'
                                )"
                            >
                                Edit
                            </button>


                            <button
                                class="delete-btn"
                                onclick="deleteStudent(${student.id})"
                            >
                                Delete
                            </button>

                        </td>

                    `;


                    studentsTable.appendChild(row);

                });

            })

            .catch(error => {

                console.error(
                    'Error loading students:',
                    error
                );

            });

    }


    // Load students when page opens

    loadStudents();



    // =====================================
    // ADD OR UPDATE STUDENT
    // =====================================

    studentForm.addEventListener(
        'submit',
        function(event) {

            // Stop page refresh

            event.preventDefault();


            const name =
                nameInput.value.trim();

            const level =
                levelInput.value.trim();

            const trade =
                tradeInput.value.trim();


            // Check fields

            if (!name || !level || !trade) {

                alert(
                    'Please fill in all fields'
                );

                return;

            }


            // Get ID

            const id =
                studentId.value;


            // =================================
            // UPDATE STUDENT
            // =================================

            if (id) {


                fetch(
                    '/api/students/' + id,
                    {

                        method: 'PUT',

                        headers: {

                            'Content-Type':
                                'application/json'

                        },

                        body: JSON.stringify({

                            name: name,

                            level: level,

                            trade: trade

                        })

                    }
                )

                    .then(response => {

                        if (!response.ok) {

                            throw new Error(
                                'Failed to update student'
                            );

                        }

                        return response.json();

                    })

                    .then(data => {

                        alert(
                            data.message
                        );


                        // Reset form

                        resetForm();


                        // Reload table

                        loadStudents();

                    })

                    .catch(error => {

                        console.error(
                            error
                        );

                        alert(
                            error.message
                        );

                    });


            }


            // =================================
            // ADD NEW STUDENT
            // =================================

            else {


                fetch(
                    '/students',
                    {

                        method: 'POST',

                        headers: {

                            'Content-Type':
                                'application/json'

                        },

                        body: JSON.stringify({

                            name: name,

                            level: level,

                            trade: trade

                        })

                    }
                )

                    .then(response => {

                        if (!response.ok) {

                            throw new Error(
                                'Failed to add student'
                            );

                        }

                        return response.text();

                    })

                    .then(data => {

                        alert(
                            'Student added successfully'
                        );


                        // Reset form

                        studentForm.reset();


                        // Reload students

                        loadStudents();

                    })

                    .catch(error => {

                        console.error(
                            error
                        );

                        alert(
                            error.message
                        );

                    });


            }

        }
    );



    // =====================================
    // EDIT STUDENT
    // =====================================

    function editStudent(
        id,
        name,
        level,
        trade
    ) {


        // Put student data into form

        studentId.value = id;

        nameInput.value = name;

        levelInput.value = level;

        tradeInput.value = trade;


        // Change form title

        formTitle.textContent =
            'Edit Student';


        // Change button text

        submitBtn.textContent =
            'Update Student';


        // Show cancel button

        cancelBtn.style.display =
            'block';


        // Scroll to form

        window.scrollTo({

            top: 0,

            behavior: 'smooth'

        });


    }



    // =====================================
    // CANCEL EDIT
    // =====================================

    function cancelEdit() {

        resetForm();

    }



    // =====================================
    // RESET FORM
    // =====================================

    function resetForm() {


        // Clear all inputs

        studentForm.reset();


        // Remove ID

        studentId.value = '';


        // Restore title

        formTitle.textContent =
            'Add New Student';


        // Restore button

        submitBtn.textContent =
            'Add Student';


        // Hide cancel button

        cancelBtn.style.display =
            'none';

    }



    // =====================================
    // DELETE STUDENT
    // =====================================

    function deleteStudent(id) {


        const confirmDelete =
            confirm(
                'Are you sure you want to delete this student?'
            );


        // Stop deletion

        if (!confirmDelete) {

            return;

        }


        fetch(
            '/api/students/' + id,
            {

                method: 'DELETE'

            }
        )

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        'Failed to delete student'
                    );

                }

                return response.json();

            })

            .then(data => {


                alert(
                    data.message
                );


                // Reload students

                loadStudents();


            })

            .catch(error => {


                console.error(
                    error
                );


                alert(
                    error.message
                );


            });


    }


</script>
