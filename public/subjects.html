<h2>Subjects Management</h2>

<section class="form-section">

    <h3 id="formTitle">Add New Subject</h3>

    <form id="subjectForm">

        <input type="hidden" id="subjectId">

        <label for="subjectName">
            Subject Name:
        </label>

        <input
            type="text"
            id="subjectName"
            placeholder="Example: Mathematics"
            required
        >

        <label for="subjectCode">
            Subject Code:
        </label>

        <input
            type="text"
            id="subjectCode"
            placeholder="Example: MATH101"
            required
        >

        <div class="button-group">

            <button
                type="submit"
                id="submitBtn"
            >
                Add Subject
            </button>

            <button
                type="button"
                id="cancelBtn"
                class="cancel-btn"
                onclick="resetForm()"
            >
                Cancel
            </button>

        </div>

    </form>

</section>


<section class="subjects-section">

    <h3>Subjects List</h3>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Subject Name</th>
                <th>Subject Code</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="subjectsTable">
        </tbody>

    </table>

</section>
```

</main>

<footer>
    <p>&copy; 2026 School Management System</p>
</footer>

<script>

    const subjectForm =
        document.getElementById('subjectForm');

    const subjectId =
        document.getElementById('subjectId');

    const subjectName =
        document.getElementById('subjectName');

    const subjectCode =
        document.getElementById('subjectCode');

    const submitBtn =
        document.getElementById('submitBtn');

    const cancelBtn =
        document.getElementById('cancelBtn');

    const formTitle =
        document.getElementById('formTitle');

    const subjectsTable =
        document.getElementById('subjectsTable');


    // LOAD SUBJECTS

    function loadSubjects() {

        fetch('/api/subjects')

            .then(response => response.json())

            .then(subjects => {

                subjectsTable.innerHTML = '';


                if (subjects.length === 0) {

                    subjectsTable.innerHTML = `
                        <tr>
                            <td colspan="4"
                                style="text-align:center;">
                                No subjects found
                            </td>
                        </tr>
                    `;

                    return;

                }


                subjects.forEach(subject => {

                    const row =
                        document.createElement('tr');


                    row.innerHTML = `
                        <td>${subject.id}</td>

                        <td>${subject.name}</td>

                        <td>${subject.code}</td>

                        <td>

                            <button
                                class="edit-btn"
                                onclick="editSubject(
                                    ${subject.id}
                                )"
                            >
                                Edit
                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteSubject(
                                    ${subject.id}
                                )"
                            >
                                Delete
                            </button>

                        </td>
                    `;


                    subjectsTable.appendChild(row);

                });

            })

            .catch(error => {

                console.error(
                    'Error loading subjects:',
                    error
                );

            });

    }


    loadSubjects();


    // ADD OR UPDATE

    subjectForm.addEventListener(
        'submit',
        function(event) {

            event.preventDefault();


            const id =
                subjectId.value;

            const name =
                subjectName.value.trim();

            const code =
                subjectCode.value.trim();


            if (!name || !code) {

                alert(
                    'Please fill in all fields'
                );

                return;

            }


            // UPDATE

            if (id) {

                fetch(
                    '/api/subjects/' + id,
                    {
                        method: 'PUT',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body: JSON.stringify({
                            name: name,
                            code: code
                        })
                    }
                )

                    .then(response =>
                        response.json()
                    )

                    .then(data => {

                        alert(data.message);

                        resetForm();

                        loadSubjects();

                    });

            }


            // ADD

            else {

                fetch(
                    '/subjects',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body: JSON.stringify({
                            name: name,
                            code: code
                        })
                    }
                )

                    .then(response =>
                        response.json()
                    )

                    .then(data => {

                        alert(
                            data.message ||
                            'Subject added successfully'
                        );

                        resetForm();

                        loadSubjects();

                    });

            }

        }
    );


    // EDIT SUBJECT

    function editSubject(id) {

        fetch('/api/subjects')

            .then(response =>
                response.json()
            )

            .then(subjects => {

                const subject =
                    subjects.find(
                        subject =>
                            subject.id == id
                    );


                if (!subject) {

                    alert(
                        'Subject not found'
                    );

                    return;

                }


                subjectId.value =
                    subject.id;

                subjectName.value =
                    subject.name;

                subjectCode.value =
                    subject.code;


                formTitle.textContent =
                    'Edit Subject';

                submitBtn.textContent =
                    'Update Subject';

                cancelBtn.style.display =
                    'block';


                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });

            });

    }


    // RESET FORM

    function resetForm() {

        subjectForm.reset();

        subjectId.value = '';

        formTitle.textContent =
            'Add New Subject';

        submitBtn.textContent =
            'Add Subject';

        cancelBtn.style.display =
            'none';

    }


    // DELETE SUBJECT

    function deleteSubject(id) {

        const answer =
            confirm(
                'Are you sure you want to delete this subject?'
            );


        if (!answer) {

            return;

        }


        fetch(
            '/api/subjects/' + id,
            {
                method: 'DELETE'
            }
        )

            .then(response =>
                response.json()
            )

            .then(data => {

                alert(data.message);

                loadSubjects();

            })

            .catch(error => {

                console.error(error);

            });

    }

</script>
