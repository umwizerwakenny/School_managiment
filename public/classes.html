<!DOCTYPE html>

<html lang="en">
<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Classes - School Management System
</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f4f6f8;
        color: #333;
    }

    header {
        background: #1e3a8a;
        color: white;
        padding: 20px;
        text-align: center;
    }

    header h1 {
        margin-bottom: 15px;
    }

    nav {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-weight: bold;
    }

    nav a:hover {
        text-decoration: underline;
    }

    main {
        width: 90%;
        max-width: 1100px;
        margin: 40px auto;
    }

    main > h2 {
        text-align: center;
        color: #1e3a8a;
        margin-bottom: 30px;
    }

    .form-section,
    .classes-section {
        background: white;
        padding: 30px;
        border-radius: 10px;
        margin-bottom: 30px;
        box-shadow:
            0 3px 10px
            rgba(0, 0, 0, 0.1);
    }

    h3 {
        color: #1e3a8a;
        margin-bottom: 20px;
    }

    form {
        display: grid;
        gap: 10px;
    }

    label {
        font-weight: bold;
    }

    input {
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        background: #1e3a8a;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }

    .edit-btn {
        background: #f59e0b;
        margin-right: 5px;
    }

    .delete-btn {
        background: #dc2626;
    }

    .cancel-btn {
        background: #6b7280;
        display: none;
    }

    .button-group {
        display: flex;
        gap: 10px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th,
    td {
        padding: 12px;
        border: 1px solid #ddd;
        text-align: left;
    }

    th {
        background: #1e3a8a;
        color: white;
    }

    footer {
        background: #1e3a8a;
        color: white;
        text-align: center;
        padding: 20px;
    }

</style>
```

</head>

<body>

<header>

```
<h1>
    School Management System
</h1>

<nav>
    <a href="/">Home</a>
    <a href="/about">About Us</a>
    <a href="/students">Students</a>
    <a href="/teachers">Teachers</a>
    <a href="/subjects">Subjects</a>
    <a href="/classes">Classes</a>
    <a href="/contact">Contact</a>
</nav>
```

</header>

<main>

```
<h2>
    Classes Management
</h2>


<!-- FORM -->

<section class="form-section">

    <h3 id="formTitle">
        Add New Class
    </h3>


    <form id="classForm">

        <input
            type="hidden"
            id="classId"
        >


        <label for="className">
            Class Name:
        </label>

        <input
            type="text"
            id="className"
            placeholder="Example: L3 A"
            required
        >


        <label for="level">
            Level:
        </label>

        <input
            type="text"
            id="level"
            placeholder="Example: L3"
            required
        >


        <label for="trade">
            Trade:
        </label>

        <input
            type="text"
            id="trade"
            placeholder="Example: Software Development"
            required
        >


        <div class="button-group">

            <button
                type="submit"
                id="submitBtn"
            >
                Add Class
            </button>


            <button
                type="button"
                id="cancelBtn"
                class="cancel-btn"
                onclick="resetForm()"
            >
                Cancel
            </button>

        </div>

    </form>

</section>


<!-- TABLE -->

<section class="classes-section">

    <h3>
        Classes List
    </h3>


    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Class Name</th>
                <th>Level</th>
                <th>Trade</th>
                <th>Actions</th>
            </tr>

        </thead>


        <tbody id="classesTable">
        </tbody>

    </table>

</section>
```

</main>

<footer>

```
<p>
    &copy; 2026 School Management System
</p>
```

</footer>

<script>

    const classForm =
        document.getElementById('classForm');

    const classId =
        document.getElementById('classId');

    const className =
        document.getElementById('className');

    const level =
        document.getElementById('level');

    const trade =
        document.getElementById('trade');

    const submitBtn =
        document.getElementById('submitBtn');

    const cancelBtn =
        document.getElementById('cancelBtn');

    const formTitle =
        document.getElementById('formTitle');

    const classesTable =
        document.getElementById('classesTable');


    // LOAD CLASSES

    function loadClasses() {

        fetch('/api/classes')

            .then(response =>
                response.json()
            )

            .then(classes => {

                classesTable.innerHTML = '';


                if (classes.length === 0) {

                    classesTable.innerHTML = `
                        <tr>
                            <td colspan="5"
                                style="text-align:center;">
                                No classes found
                            </td>
                        </tr>
                    `;

                    return;

                }


                classes.forEach(classItem => {

                    const row =
                        document.createElement('tr');


                    row.innerHTML = `

                        <td>
                            ${classItem.id}
                        </td>

                        <td>
                            ${classItem.class_name}
                        </td>

                        <td>
                            ${classItem.level}
                        </td>

                        <td>
                            ${classItem.trade}
                        </td>

                        <td>

                            <button
                                class="edit-btn"
                                onclick="editClass(${classItem.id})"
                            >
                                Edit
                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteClass(${classItem.id})"
                            >
                                Delete
                            </button>

                        </td>

                    `;


                    classesTable.appendChild(row);

                });

            });

    }


    loadClasses();


    // ADD OR UPDATE CLASS

    classForm.addEventListener(
        'submit',
        function(event) {

            event.preventDefault();


            const id =
                classId.value;

            const newClassName =
                className.value.trim();

            const newLevel =
                level.value.trim();

            const newTrade =
                trade.value.trim();


            if (
                !newClassName ||
                !newLevel ||
                !newTrade
            ) {

                alert(
                    'Please fill in all fields'
                );

                return;

            }


            // UPDATE

            if (id) {

                fetch(
                    '/api/classes/' + id,
                    {
                        method: 'PUT',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body: JSON.stringify({

                            class_name:
                                newClassName,

                            level:
                                newLevel,

                            trade:
                                newTrade

                        })
                    }
                )

                    .then(response =>
                        response.json()
                    )

                    .then(data => {

                        alert(data.message);

                        resetForm();

                        loadClasses();

                    });

            }


            // ADD

            else {

                fetch(
                    '/classes',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body: JSON.stringify({

                            class_name:
                                newClassName,

                            level:
                                newLevel,

                            trade:
                                newTrade

                        })
                    }
                )

                    .then(response =>
                        response.json()
                    )

                    .then(data => {

                        alert(
                            data.message ||
                            'Class added successfully'
                        );

                        resetForm();

                        loadClasses();

                    });

            }

        }
    );


    // EDIT CLASS

    function editClass(id) {

        fetch('/api/classes')

            .then(response =>
                response.json()
            )

            .then(classes => {

                const classItem =
                    classes.find(
                        item =>
                            item.id == id
                    );


                if (!classItem) {

                    alert(
                        'Class not found'
                    );

                    return;

                }


                classId.value =
                    classItem.id;

                className.value =
                    classItem.class_name;

                level.value =
                    classItem.level;

                trade.value =
                    classItem.trade;


                formTitle.textContent =
                    'Edit Class';

                submitBtn.textContent =
                    'Update Class';

                cancelBtn.style.display =
                    'block';


                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });

            });

    }


    // RESET

    function resetForm() {

        classForm.reset();

        classId.value = '';

        formTitle.textContent =
            'Add New Class';

        submitBtn.textContent =
            'Add Class';

        cancelBtn.style.display =
            'none';

    }


    // DELETE

    function deleteClass(id) {

        const answer =
            confirm(
                'Are you sure you want to delete this class?'
            );


        if (!answer) {

            return;

        }


        fetch(
            '/api/classes/' + id,
            {
                method: 'DELETE'
            }
        )

            .then(response =>
                response.json()
            )

            .then(data => {

                alert(data.message);

                loadClasses();

            });

    }

</script>

</body>
</html>
